<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Colorink 测试向导</title>
<style>
body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;margin:20px;background:#171722;color:#e6e6ef}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:20px 0 8px}
.badge{background:#2c2c3e;border-radius:6px;padding:2px 8px;font-size:12px;color:#9aa}
.verdict{font-size:15px;margin:8px 0;font-weight:600}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border:1px solid #33334a;padding:4px 8px;text-align:left}
th{background:#22222f}
.p{color:#7ee787}.f{color:#f85149}.s{color:#9198a1}
.item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #262634;font-size:13px}
.item .id{color:#8b949e;min-width:34px}.item .txt{flex:1}
button{cursor:pointer;border:0;border-radius:5px;padding:3px 10px;font-size:12px;background:#2c2c3e;color:#e6e6ef}
button.ok{background:#1f6f3b}button.no{background:#8f2f2f}button.sk{background:#3a3a4e}
button:disabled{opacity:.35;cursor:default}
.note{background:#20202c;border:1px solid #33334a;border-radius:5px;color:#ddd;padding:3px 6px;font-size:12px;width:180px}
#progress{font-size:13px;color:#8b949e;margin:6px 0}
img{max-width:100%;border-radius:6px;border:1px solid #33334a;margin:4px 0}
.shots{display:flex;gap:8px;flex-wrap:wrap}.shots img{max-width:340px;max-height:220px}
a{color:#7aa2f7}
</style>
</head>
<body>
<h1>Colorink 测试向导 <span class="badge" id="runid"></span> <span class="badge" id="mode"></span></h1>
<div id="progress"></div>
<div class="verdict" id="verdict"></div>
<div id="auto"></div>
<div id="guided"></div>
<div id="manual"></div>
<div style="margin-top:16px">
  <a href="/api/report" target="_blank">查看 Markdown 报告</a> · <button onclick="location.reload()">刷新</button>
</div>
<script>
const ICON = {pass:'√', fail:'×', skip:'·', warn:'!'};
let S = null;
async function load(){
  S = await (await fetch('/api/state')).json();
  document.getElementById('runid').textContent = 'run ' + S.run_id;
  document.getElementById('mode').textContent = S.release ? '发版模式' : '日常模式';
  render();
}
function verdict(){
  const manual = S.manual || {};
  const rel = S.release;
  const problems = [];
  for(const [k,v] of Object.entries(S.auto||{})) if(v.result==='fail') problems.push('auto/'+k);
  for(const [k,v] of Object.entries(S.guided||{})) if(v.result!=='pass') problems.push('guided/'+k);
  const CL = window.CL || [];
  let tot=0, done=0;
  for(const ph of CL){ for(const it of ph.items||[]){
    if(it.kind!=='manual') continue;
    if(ph.release_only && !rel) continue;
    if(it.release_only && !rel) continue;
    tot++; const r = manual[it.id];
    if(r){done++;}
    if(rel && (ph.release_only||it.release_only||it.critical) && (!r||r.result!=='pass')) problems.push('manual/'+it.id);
    else if(!rel && r && r.result==='fail') problems.push('manual/'+it.id);
  }}
  const v = problems.length ? (rel?'❌ 不能发版':'⚠️ 有失败项') : (rel?'✅ 可以发版':'✅ 通过');
  document.getElementById('verdict').textContent = '结论: ' + v;
  document.getElementById('progress').textContent = `手测进度: ${done}/${tot}`;
  return problems;
}
function render(){
  const auto = document.getElementById('auto');
  auto.innerHTML = '<h2>自动化守卫</h2>';
  if(Object.keys(S.auto||{}).length){
    let t='<table><tr><th>检查</th><th>结果</th><th>说明</th></tr>';
    for(const [k,v] of Object.entries(S.auto))
      t+=`<tr><td>${k}</td><td class="${v.result}">${ICON[v.result]||'?'} ${v.result}</td><td>${v.note||''}</td></tr>`;
    auto.innerHTML += t+'</table>';
  } else auto.innerHTML += '<div class="s">未运行（python tools/test_wizard.py auto）</div>';
  const g = document.getElementById('guided');
  g.innerHTML = '<h2>半自动引导</h2>';
  if(Object.keys(S.guided||{}).length){
    let t='<table><tr><th>#</th><th>结果</th><th>说明</th></tr>';
    for(const [k,v] of Object.entries(S.guided)){
      const shots = (v.shots||[]).filter(Boolean).map(p=>p.replace(/\\/g,'/'));
      const imgs = shots.map(p=>`<a href="/shots/${p.split('/shots/')[1]}" target="_blank">[图]</a>`).join(' ');
      t+=`<tr><td>${k}</td><td class="${v.result}">${ICON[v.result]||'?'} ${v.result}</td><td>${v.note||''} ${imgs}</td></tr>`;
    }
    g.innerHTML += t+'</table>';
  } else g.innerHTML += '<div class="s">未运行（python tools/test_wizard.py guided）</div>';
  renderManual();
  verdict();
}
function renderManual(){
  const box = document.getElementById('manual');
  box.innerHTML = '<h2>手测</h2>';
  const manual = S.manual||{};
  // 清单数据直接内嵌读取: 从 /api/state 只含结果，清单需另取——由后端注入在 state 里
  (S.phases||[]).forEach(ph=>{
    if(ph.release_only && !S.release) return;
    box.innerHTML += `<h2 style="font-size:14px;color:#9aa">阶段 ${ph.id} ${ph.title}${ph.release_only?'（发版）':''}</h2>`;
    (ph.items||[]).filter(it=>it.kind==='manual'&&(!it.release_only||S.release)).forEach(it=>{
      const r = manual[it.id];
      const row = document.createElement('div'); row.className='item';
      const cls = r?r.result:'';
      row.innerHTML = `<span class="id">${it.id}</span><span class="txt">${it.text}</span>`+
        `<button class="ok" ${cls==='pass'?'disabled':''} onclick="setItem('${it.id}','pass',this)">通过</button>`+
        `<button class="no" ${cls==='fail'?'disabled':''} onclick="setItem('${it.id}','fail',this)">失败</button>`+
        `<button class="sk" ${cls==='skip'?'disabled':''} onclick="setItem('${it.id}','skip',this)">跳过</button>`+
        `<input class="note" placeholder="备注" value="${(r&&r.note)||''}" onchange="setNote('${it.id}',this.value)">`+
        `<span class="${cls}">${r?(ICON[r.result]||'?')+' '+r.result:''}</span>`;
      box.appendChild(row);
    });
  });
}
async function setItem(id,result,btn){
  await fetch('/api/item',{method:'POST',body:JSON.stringify({item_id:id,result,note:''})});
  btn.disabled = true; location.reload();
}
async function setNote(id,val){
  const r = S.manual[id]; if(!r){return;}
  await fetch('/api/item',{method:'POST',body:JSON.stringify({item_id:id,result:r.result,note:val})});
}
load();
</script>
</body>
</html>
